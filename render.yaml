# =============================================================================
# BizCore Backend — Render Blueprint (Infrastructure as Code)
# =============================================================================

services:
  # --- Web Service : API Spring Boot -----------------------------------------
  - type: web
    name: bizcore-api
    runtime: docker                       # build à partir du Dockerfile (≠ image pré-construite)
    repo: https://github.com/Chris-Manuelpipo/bizcore
    region: frankfurt
    plan: free                            # gratuit ; spin-down après 15 min d'inactivité + 512 Mo RAM
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend              # le Dockerfile fait COPY .mvn/ mvnw pom.xml src/ → contexte = backend/
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080

      # --- Base de données ---
      # Render fournit l'URL au format postgresql:// via connectionString (réseau privé).
      # docker-entrypoint.sh la convertit en jdbc:postgresql://... + user/password au démarrage.
      - key: DATABASE_URL
        fromDatabase:
          name: bizcore-db
          property: connectionString

      # --- JWT ---
      - key: JWT_SECRET
        generateValue: true               # valeur aléatoire base64 256 bits générée par Render
      - key: JWT_EXPIRATION
        value: 86400000

      # --- CORS (front Vercel) ---
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://bizcore-liard.vercel.app

      # --- Redis / Key Value (cache + rate limiting bucket4j) ---
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: keyvalue
          name: bizcore-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: keyvalue
          name: bizcore-redis
          property: port

      # --- Kafka ---
      # Render ne fournit pas de Kafka. Le consumer @KafkaListener est désactivé pour éviter
      # les erreurs de connexion en boucle (aucun producteur Kafka n'est utilisé dans le code).
      - key: SPRING_KAFKA_LISTENER_AUTO_STARTUP
        value: false

      # --- Logs ---
      - key: LOGGING_LEVEL_ROOT
        value: WARN
      - key: LOGGING_LEVEL_COM_BIZCORE
        value: INFO

  # --- Key Value (Redis) -----------------------------------------------------
  - type: keyvalue
    name: bizcore-redis
    plan: free                            # 25 Mo, suffisant pour cache + rate limiting
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []                       # connexions internes uniquement (réseau privé Render)

databases:
  # --- PostgreSQL ------------------------------------------------------------
  - name: bizcore-db
    databaseName: bizcore
    user: bizcore
    region: frankfurt
    plan: free                            # expire après 30 j ; passer à basic-256mb pour la prod durable
    postgresMajorVersion: 16
