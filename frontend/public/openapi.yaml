openapi: 3.0.3
info:
  title: BizCore API
  description: "Business as a Service — API générique de gestion des métiers"
  version: "1.0.0"
  contact:
    name: BizCore Team
    email: support@bizcore.com
servers:
  - url: http://localhost:8080
    description: Serveur de développement local
  - url: https://api.bizcore.com
    description: Serveur de production
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtenu via POST /api/auth/login
tags:
  - name: "Auth"
  - name: "Tenant"
  - name: "User"
  - name: "Actor"
  - name: "Business"
  - name: "ServiceCatalogue"
  - name: "ServiceRequest"
  - name: "Invoice"
  - name: "BusinessRule"
  - name: "Portfolio"
  - name: "Media"
  - name: "Resource"
  - name: "Message"
  - name: "Notification"
  - name: "Audit"
  - name: "Analytics"
  - name: "Currency"
paths:
  "/api/auth/register":
    post:
      tags: ["Auth"]
      summary: "Enregistrer un nouvel utilisateur"
      description: "Crée un compte utilisateur et retourne immédiatement un token JWT."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {
          "email": "user@example.com",
          "password": "secret123",
          "firstName": "Jean",
          "lastName": "Dupont"
}{
                "email": "user@example.com",
                "password": "secret123",
                "firstName": "Jean",
                "lastName": "Dupont"
              }
      responses:
        "200":
          description: Succès
        "400":
          description: Erreur de validation
  "/api/auth/login":
    post:
      tags: ["Auth"]
      summary: "Authentification"
      description: "Authentifie un utilisateur et retourne un token JWT."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {
          "email": "user@example.com",
          "password": "secret123"
}{
                "email": "user@example.com",
                "password": "secret123"
              }
      responses:
        "200":
          description: Succès
        "400":
          description: Erreur de validation
  "/api/auth/users/{id}/roles":
    patch:
      tags: ["Auth"]
      summary: "Ajouter un rôle"
      description: "Ajoute un rôle à un utilisateur."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: role
          in: query
          required: false
          schema:
            type: "string"
            enum: "USER,ADMIN"
      responses:
        "200":
          description: Succès
        "400":
          description: Erreur de validation
        "401":
          description: Token absent ou invalide
    delete:
      tags: ["Auth"]
      summary: "Retirer un rôle"
      description: "Retire un rôle d'un utilisateur."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: role
          in: query
          required: false
          schema:
            type: "string"
            enum: "USER,ADMIN"
      responses:
        "200":
          description: Succès
        "400":
          description: Erreur de validation
        "401":
          description: Token absent ou invalide
  "/api/tenants":
