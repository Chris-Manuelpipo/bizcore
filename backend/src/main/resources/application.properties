spring.application.name=bizcore-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/bizcore
spring.datasource.username=bizcore
spring.datasource.password=bizcore123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Server
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT (secret OBLIGATOIRE en prod via la variable d'env JWT_SECRET — ≥ 256 bits)
jwt.secret=${JWT_SECRET:bizcore_secret_key_must_be_at_least_256_bits_long_for_hmac_sha}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — origines autorisées (séparées par des virgules), surchargées en prod
# via APP_CORS_ALLOWED_ORIGINS. Défaut = front en local.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}

# Redis (localhost pour dev local, surchargé par docker-compose en prod via env vars)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.cache.type=redis

# Kafka (localhost pour dev local, surchargé par docker-compose en prod via env vars)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:bizcore-group}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer