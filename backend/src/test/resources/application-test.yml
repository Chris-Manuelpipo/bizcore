# Test configuration for BizCore Backend
spring:
  application:
    name: bizcore-backend-test

  # H2 In-Memory Database for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA/Hibernate configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Liquibase configuration
  liquibase:
    enabled: false

  # H2 Console (for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console

# Server configuration
server:
  port: 8081

# JWT configuration for tests
jwt:
  secret: test_secret_key_for_testing_purposes_must_be_at_least_256_bits_long
  expiration: 3600000

# Logging
logging:
  level:
    root: WARN
    com.bizcore: DEBUG
    org.springframework.security: DEBUG